name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The core job installs nothing. Harnesses, tasks, the verifier, and every
  # static guard import only the standard library, so this job runs real checks
  # in seconds -- including the harness-layer smoke test, which is the one that
  # would otherwise need a GPU. If someone adds a third-party import to
  # src/multiharness/ or to a guard, this job is where it breaks.
  core:
    name: core (no third-party deps, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Byte-compile everything before anything else runs. This is not
      # decoration: during development a scripted edit wrote a literal `/n`
      # where a newline belonged (`if cond:/n    sys.path.insert(...)`), which
      # turned four entry points into syntax errors while they still *looked*
      # right in a diff. Compiling every file catches that whole class in one
      # second, before any check gets a chance to fail confusingly.
      - name: Compile every Python file
        run: python -m compileall -q src scripts tests tools

      # No `pip install`. A dependency-free claim that is never tested is a
      # claim, not a property.
      - name: Assert the core has no third-party imports
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          THIRD_PARTY = {
              "torch", "trl", "transformers", "datasets", "peft", "accelerate",
              "numpy", "pandas", "yaml", "requests", "httpx",
          }
          # Files allowed to import the RL stack: the rollout driver needs a
          # model, and the scripts that train or evaluate obviously do.
          ALLOWED = {
              "src/multiharness/rollout.py",
              "scripts/train.py",
              "scripts/eval.py",
              "scripts/probe.py",
              "scripts/diag.py",
              "tests/smoke_trl.py",
          }
          offenders = []
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              rel = path.as_posix()
              if rel.startswith(("tools/",)) or ".venv" in rel:
                  continue
              if rel in ALLOWED:
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=rel)
              for node in ast.walk(tree):
                  roots = []
                  if isinstance(node, ast.Import):
                      roots = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      roots = [node.module.split(".")[0]]
                  for root in roots:
                      if root in THIRD_PARTY:
                          offenders.append(f"{rel}:{node.lineno} imports {root!r}")
          if offenders:
              print("These files must stay dependency-free:")
              for o in offenders:
                  print("  " + o)
              sys.exit(1)
          print("core is dependency-free")
          PY

      # The checks are standalone scripts with their own PASS/FAIL reporting and
      # exit codes, so they are run directly rather than through pytest. This is
      # the same command sequence a contributor runs locally.
      - name: Static guards and harness-layer smoke
        run: |
          python scripts/guard_tool_surface.py
          python tests/test_path_errors.py
          python tests/test_shell_timeout.py
          python tests/test_scan_tooling.py
          python tests/test_verifier_modes.py
          python tests/test_rsi_stats.py
          python tests/test_rsi_generator.py
          python tests/test_rsi_loop.py
          python tests/smoke_env.py

  # The figures are evidence, so they are checked like evidence: decoded from
  # the committed bytes with nothing but the standard library. A plotting bug
  # that produces a blank canvas still writes a valid PNG of plausible size and
  # the README would keep embedding it, so the check is on the pixels rather
  # than on the file's existence. Stdlib-only on purpose -- a check that needed
  # the plotting library could not catch a bug in it.
  figures:
    name: figures (decodable, non-degenerate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every committed figure
        run: python tools/check_figures.py

  docs:
    name: docs (bilingual sync)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # README.md and README.zh-CN.md must stay structurally in sync: same
      # sections, same code blocks, same links, same machine-readable content.
      # Stdlib only -- no install step needed.
      - name: Check README i18n parity
        run: python tools/check_readme_i18n.py

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.6"

      - name: Ruff
        run: ruff check .
